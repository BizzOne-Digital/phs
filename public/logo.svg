<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none" role="img" aria-label="Premier Home Services (PHS)">
  <defs>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Circuit ring -->
  <circle cx="40" cy="40" r="28" stroke="url(#boltGrad)" stroke-width="1.5" opacity="0.35"/>
  <circle cx="40" cy="40" r="22" stroke="#3B82F6" stroke-width="0.75" stroke-dasharray="3 4" opacity="0.5"/>
  <!-- Lightning bolt mark -->
  <path filter="url(#glow)" d="M48 14 L28 42 H40 L32 66 L52 36 H40 L48 14Z" fill="url(#boltGrad)"/>
  <!-- Accent node -->
  <circle cx="40" cy="40" r="2.5" fill="#F59E0B" opacity="0.9"/>
  <!-- Wordmark -->
  <text x="82" y="48" font-family="Segoe UI, system-ui, sans-serif" font-size="36" font-weight="700" letter-spacing="4" fill="url(#textGrad)">PHS</text>
  <text x="84" y="64" font-family="Segoe UI, system-ui, sans-serif" font-size="8" font-weight="500" letter-spacing="2.5" fill="#64748B">ELECTRICAL · HVAC · PLUMBING</text>
</svg>
